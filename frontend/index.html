<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login API Frontend</title>
</head>

<body class="min-h-screen bg-[#0B1120] text-slate-100 font-sans">

<main class="min-h-screen p-6">

  <!-- Div=1. Header container -->
  <div class="relative bg-[#111827] border-2 border-[#263449] rounded-2xl p-6">

    <!-- Div=2. Header content row -->
    <div class="flex items-center justify-between gap-4">


      <!-- Div=2. Left-side Group -->
      <div class="flex items-center justify-between gap-4">

         <!-- Div=2.1 Icon box -->
         <div class="grid place-items-center rounded-2xl bg-[#0B1120] border-2 border-[#263449] h-14 w-14
                                      font-mono font-bold text-cyan-400 text-3xl leading-none">
            <span class="-translate-y-0.5">&gt;_</span> <!-- &gt; is for simbol '>' -->
         </div><!-- End Div=2.1 -->

         <div><!-- Div=2.2 Title group -->
            <h1 class="text-3xl font-bold text-cyan-400">Auth API Console</h1>
            <p class="text-sm text-slate-400">Frontend REST API v2.3</p>
         </div><!-- End Div=2.2 -->

      </div><!-- End Div=2 Left-side Group-->


      <!-- Div=2 Right-side Group -->
      <div class="relative flex items-center justify-between gap-20 pr-28">

        <div class="text-sm text-slate-400">
            <p>Spring Boot &nbsp;&nbsp; PostgreSQL &nbsp;&nbsp; JWT</p>

            <div id="backend-status"
                    class="flex items-center justify-center gap-2 mt-2 rounded-full border-2 border-[#263449] px-2 pt-1 pb-2">
               <span id="backend-status-dot" class="text-yellow-400">●</span>
               <span id="backend-status-text">localhost:8081 checking...</span>
            </div>
        </div>

        <div class="absolute right-0 bottom-0">
          <p class="text-cyan-600">Dev. Yeko</p>
        </div>

      </div><!-- End Div=2 Right-side Group-->

    </div><!-- End Div=2 Header content row-->

  </div><!-- End Div=1 Header Container-->

</main>

<script type="module" src="./src/main.js"></script>
</body>
</html>
